name: Validate JNPDI Data & Governance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 12-point data quality validator
        run: python3 src/jnpdi_validator.py

      - name: Run fail-closed governance gate
        run: python3 src/governance_gate.py
